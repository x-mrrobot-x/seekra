<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080D14" id="meta-theme">
  <title>NEXUS — Intelligent File Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="aurora"></div>
  <div class="grain"></div>
  <div class="phone">
    <header>
      <div class="logo">
        <div class="mark"><i data-lucide="hexagon"></i></div>
        <b>NEX<i>US</i></b>
      </div>
    </header>

    <main>
      <section class="view on" id="view-search"></section>
      <section class="view view-fixed" id="view-results"></section>
      <section class="view view-fixed" id="view-explorer"></section>
      <section class="view" id="view-saved"></section>
      <section class="view" id="view-settings"></section>
    </main>

    <nav id="nav">
      <div class="nav-bar" id="nav-bar"></div>
      <button class="on" data-view="search" data-tab="search"><span class="nav-icon"><i data-lucide="search"></i></span><span data-i18n="nav.search"></span></button>
      <button data-view="explorer" data-tab="explorer"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span data-i18n="nav.explorer"></span></button>
      <button data-view="saved" data-tab="saved"><span class="nav-icon"><i data-lucide="bookmark"></i></span><span data-i18n="nav.saved"></span></button>
      <button data-view="settings" data-tab="settings"><span class="nav-icon"><i data-lucide="settings"></i></span><span data-i18n="nav.settings"></span></button>
    </nav>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
